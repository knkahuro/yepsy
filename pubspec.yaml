name: yepsy
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  menstrual_cycle_widget: ^4.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.1.0
  table_calendar: ^3.2.0
  image_picker: ^1.2.1
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2
  csv: ^6.0.0
  uuid: ^4.2.0
  intl: ^0.20.0
  archive: ^3.6.1
  shimmer: ^3.0.0
  go_router: ^17.1.0
  image: ^4.3.0
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  local_auth: ^3.0.0
  path: ^1.9.1
  crypto: ^3.0.7
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/yepsy.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
